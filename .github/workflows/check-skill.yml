name: check-skill

# Guard the skill against drifting from pangu.js: every `before → after`
# example in skills/pangu/SKILL.md must match the pinned pangu's output, and
# every upstream rule must be mapped, pinned, and taught by an example.
# `npm run check` runs every checker before failing, so a bump PR shows all
# of its stale stamps and rule changes in one run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
